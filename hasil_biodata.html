<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Biodata Siswa - Linzz Luxury</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #ffd700;
      --card-bg: rgba(13, 18, 30, 0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: #05070d;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3.5rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 1. ANIMASI BACKGROUND PUTAR (SAMA DENGAN FORM) */
    .bg-animation {
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: 
        radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.35), transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(138, 43, 226, 0.3), transparent 40%),
        radial-gradient(circle at 50% 20%, rgba(255, 140, 0, 0.25), transparent 35%);
      animation: rotateBg 12s linear infinite;
      filter: blur(50px);
      z-index: 0;
    }

    @keyframes rotateBg {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 2. CARD CONTAINER & ANIMASI MASUK */
    .container {
      width: 100%; max-width: 560px;
      position: relative; z-index: 2;
      animation: popUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(212, 175, 55, 0.2);
    }

    .card-header { text-align: center; margin-bottom: 2rem; }
    .badge {
      display: inline-block;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.8rem; font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card-header h2 span { color: var(--gold); }

    /* 3. BARIS DATA & ANIMASI STAGGERED (MUNCUL BERURUTAN) */
    .data-container { display: flex; flex-direction: column; gap: 0.75rem; }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      transition: 0.3s;
      animation: fadeInRow 0.5s ease forwards;
    }

    .data-row:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--gold);
      transform: translateX(4px);
    }

    @keyframes fadeInRow {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .data-row .label { font-size: 0.85rem; font-weight: 600; color: #9ca3af; }
    .data-row .value { font-size: 0.95rem; font-weight: 600; color: #fff; text-align: right; }

    /* TOMBOL KEMBALI */
    .btn-submit {
      display: block; text-align: center;
      width: 100%; padding: 1rem; margin-top: 1.8rem;
      background: linear-gradient(135deg, #ffd700, #b8860b);
      color: #05070d; text-decoration: none; border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
      transition: 0.3s;
    }

    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255, 215, 0, 0.6); }

    @media (max-width: 480px) {
      .data-row { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
      .data-row .value { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- LAYER ANIMASI BACKGROUND -->
  <div class="bg-animation"></div>

  <div class="container">
    <div class="card">
      
      <div class="card-header">
        <span class="badge">Data Terverifikasi</span>
        <h2>Hasil Biodata <span>Siswa</span></h2>
      </div>

      <!-- TEMPAT HASIL JAVASCRIPT MUNCUL -->
      <div class="data-container" id="result"></div>

      <a href="form_biodata.html" class="btn-submit">Kembali ke Form</a>

    </div>
  </div>

  <script>
    // 1. Mengambil data dari URL (query parameter dari form GET)
    const params = new URLSearchParams(window.location.search);
    const container = document.getElementById('result');

    // 2. Daftar field data yang mau ditampilkan
    const fields = [
      { key: 'nama', label: 'Nama Lengkap' },
      { key: 'alamat', label: 'Alamat' },
      { key: 'jurusan', label: 'Jurusan' },
      { key: 'goldar', label: 'Golongan Darah' },
      { key: 'jk', label: 'Jenis Kelamin' },
      { key: 'tinggi', label: 'Tinggi Badan (cm)' },
      { key: 'berat', label: 'Berat Badan (kg)' },
      { key: 'hobi', label: 'Hobi' },
      { key: 'nohp', label: 'Nomor HP' }
    ];

    // 3. Loop untuk merender setiap baris data
    fields.forEach((field, index) => {
      const val = params.get(field.key) || '-';
      
      // Tambahkan delay animasi per baris (Staggered animation)
      container.innerHTML += `
        <div class="data-row" style="animation-delay: ${index * 0.05}s">
          <span class="label">${field.label}</span>
          <span class="value">${val}</span>
        </div>
      `;
    });
  </script>

</body>
</html>
