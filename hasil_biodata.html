<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Biodata Siswa - Tema Luar Angkasa</title>
  <style>
    /* 1. Base Body & Scroll Setup */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-y: auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
    }

    /* 2. Animasi Background Gradient Luar Angkasa (Nebula & Space Void) */
    body {
      background: linear-gradient(-45deg, #0b0d1b, #1a103c, #2b0845, #080014);
      background-size: 400% 400%;
      animation: spaceGlow 15s ease infinite;
    }

    @keyframes spaceGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 3. Lapis Animasi Objek Luar Angkasa Melayang */
    .space-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .space-item {
      position: absolute;
      font-size: 36px;
      animation: orbitFloat linear infinite;
    }

    /* Posisi Awal, Ukuran, & Kecepatan Objek */
    .s1 { top: 10%; left: -10%; animation-duration: 14s; animation-delay: 0s; } /* Roket */
    .s2 { top: 30%; left: -10%; animation-duration: 20s; animation-delay: 4s; font-size: 42px; } /* UFO */
    .s3 { top: 60%; left: -10%; animation-duration: 16s; animation-delay: 8s; font-size: 32px; } /* Astronot */
    .s4 { top: 80%; left: -10%; animation-duration: 12s; animation-delay: 2s; font-size: 28px; } /* Komet */
    .s5 { top: 45%; left: -10%; animation-duration: 25s; animation-delay: 10s; font-size: 48px; } /* Planet */

    /* Keyframes Objek Melintas Melayang (Maju dari Kiri ke Kanan sambil Bergoyang) */
    @keyframes orbitFloat {
      0% {
        transform: translateX(0) translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      50% {
        transform: translateX(60vw) translateY(-30px) rotate(180deg);
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateX(115vw) translateY(10px) rotate(360deg);
        opacity: 0;
      }
    }

    /* 4. Kartu Hasil Biodata Transparan Futuristik */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(20, 20, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 500px;
      animation: popIn 0.5s ease-out;
      color: #ffffff;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #7d5fff;
      text-shadow: 0 0 10px rgba(125, 95, 255, 0.6);
      font-size: 24px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
    }

    .data-row span.label {
      font-weight: 600;
      color: #a4b0be;
    }

    .data-row span.value {
      font-weight: 500;
      color: #ffffff;
    }

    .btn-back {
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px;
      background: linear-gradient(135deg, #7d5fff, #7158e2);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 25px;
      box-sizing: border-box;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(125, 95, 255, 0.5);
    }
  </style>
</head>
<body>

  <!-- Objek Luar Angkasa Bergerak -->
  <div class="space-layer">
    <div class="space-item s1">🚀</div>
    <div class="space-item s2">🛸</div>
    <div class="space-item s3">👨‍🚀</div>
    <div class="space-item s4">☄️</div>
    <div class="space-item s5">🪐</div>
  </div>

  <div class="container">
    <div class="card">
      <h2>🚀 Hasil Biodata Siswa</h2>
      
      <div id="result"></div>

      <a href="form_biodata.html" class="btn-back">⬅️ Kembali ke Form</a>
    </div>
  </div>

  <script>
    // Membaca data yang dikirim dari URL
    const params = new URLSearchParams(window.location.search);
    const container = document.getElementById('result');

    const fields = [
      { key: 'nama', label: '👤 Nama Lengkap' },
      { key: 'alamat', label: '🏠 Alamat' },
      { key: 'jurusan', label: '🎓 Jurusan' },
      { key: 'jk', label: 'Jenis Kelamin' },
      { key: 'tinggi', label: '📏 Tinggi Badan (cm)' },
      { key: 'berat', label: '⚖️ Berat Badan (kg)' },
      { key: 'goldar', label: '🩸 Golongan Darah' },
      { key: 'hobi', label: '🎨 Hobi' },
      { key: 'nohp', label: '📱 Nomor HP' }
    ];

    fields.forEach(field => {
      const val = params.get(field.key) || '-';
      container.innerHTML += `
        <div class="data-row">
          <span class="label">${field.label}:</span>
          <span class="value">${val}</span>
        </div>
      `;
    });
  </script>

</body>
</html>
