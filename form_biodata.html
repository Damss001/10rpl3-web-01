<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Siswa - Animated Sunset & Animals</title>
  <style>
    /* Base Body & Scroll Setup */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-y: auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Animasi Sunset Background */
    body {
      background: linear-gradient(-45deg, #ff512f, #f09819, #e03e1f, #ff8c00);
      background-size: 400% 400%;
      animation: sunsetGlow 10s ease infinite;
    }

    @keyframes sunsetGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Burung Terbang */
    .birds-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bird-track {
      position: absolute;
      animation: flyForward linear infinite;
    }

    .bird {
      display: inline-block;
      font-size: 32px;
      transform: scaleX(-1);
      animation: floatAndFlap 1.6s ease-in-out infinite alternate;
    }

    .bird-track.b1 { top: 10%; animation-duration: 9s; animation-delay: 0s; }
    .bird-track.b2 { top: 25%; animation-duration: 13s; animation-delay: 3s; }
    .bird-track.b3 { top: 40%; animation-duration: 11s; animation-delay: 6s; }

    .b2 .bird { font-size: 26px; animation-duration: 1.2s; }
    .b3 .bird { font-size: 36px; animation-duration: 2s; }

    @keyframes flyForward {
      0% { left: -15%; }
      100% { left: 115%; }
    }

    @keyframes floatAndFlap {
      0% { transform: scaleX(-1) translateY(0px) rotate(-6deg); }
      100% { transform: scaleX(-1) translateY(-22px) rotate(8deg); }
    }

    /* Container Form */
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 500px;
    }

    .card h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .form-group input, 
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .radio-group label {
      font-weight: normal;
      margin-bottom: 0;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #ff512f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s, transform 0.2s;
    }

    .btn-submit:hover {
      background-color: #e03e1f;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="birds-layer">
    <div class="bird-track b1"><span class="bird">🦅</span></div>
    <div class="bird-track b2"><span class="bird">🕊️</span></div>
    <div class="bird-track b3"><span class="bird">🦅</span></div>
  </div>

  <div class="container">
    <div class="card">
      <h2>📝 Form Biodata Siswa</h2>

      <!-- Pindah ke hasil_biodata.html menggunakan metode GET -->
      <form action="hasil_biodata.html" method="GET">
        <div class="form-group">
          <label>👤 Nama Lengkap *</label>
          <input type="text" name="nama" placeholder="Masukkan nama..." required>
        </div>

        <div class="form-group">
          <label>🏠 Alamat *</label>
          <input type="text" name="alamat" placeholder="Masukkan alamat..." required>
        </div>

        <div class="form-group">
          <label>🎓 Jurusan</label>
          <select name="jurusan">
            <option value="RPL">RPL</option>
            <option value="TSM">TSM</option>
            <option value="TKJ">TKJ</option>
            <option value="TKR">TKR</option>
          </select>
        </div>

        <div class="form-group">
          <label>Jenis Kelamin</label>
          <div class="radio-group">
            <label><input type="radio" name="jk" value="Laki-laki" checked> 👨 Laki-laki</label>
            <label><input type="radio" name="jk" value="Perempuan"> 👩 Perempuan</label>
            <label><input type="radio" name="jk" value="Lainnya"> ⚧️ Lainnya</label>
          </div>
        </div>

        <div class="form-group">
          <label>📏 Tinggi Badan (cm)</label>
          <input type="number" name="tinggi" placeholder="Contoh: 170">
        </div>

        <div class="form-group">
          <label>⚖️ Berat Badan (kg)</label>
          <input type="number" name="berat" placeholder="Contoh: 60">
        </div>

        <div class="form-group">
          <label>🩸 Golongan Darah</label>
          <select name="goldar">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
          </select>
        </div>

        <div class="form-group">
          <label>🎨 Hobi</label>
          <input type="text" name="hobi" placeholder="Masukkan hobi...">
        </div>

        <div class="form-group">
          <label>📱 Nomor HP</label>
          <input type="number" name="nohp" placeholder="08xxxxxxxxxx">
        </div>

        <button type="submit" class="btn-submit">💾 SIMPAN</button>
      </form>
    </div>
  </div>

</body>
</html>
